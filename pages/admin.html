<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Control Center · CSE 62B</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .adm{max-width:1050px;margin:0 auto;padding:82px 18px 40px}.adm-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .adm-back,.adm-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer;text-decoration:none}
    .adm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.adm-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px}
    .adm-card b{display:block;font-size:1.3rem;color:var(--accent-bright);margin-top:4px}.adm-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:17px;margin-top:14px}
    .adm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.adm input,.adm textarea,.adm select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px;margin-top:9px}
    .adm textarea{min-height:100px;resize:vertical}.adm-primary{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:0;color:#fff;font-weight:700}.adm-list{display:grid;gap:8px;margin-top:10px}
    .adm-note{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--border);padding:12px;border-radius:11px}.adm-note div{flex:1}.adm-note small{color:var(--muted)}
    .adm-msg{font-size:.82rem;color:var(--muted);margin-top:8px}.adm-login{max-width:420px;margin:16vh auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px}
    @media(max-width:700px){.adm-grid{grid-template-columns:1fr 1fr}.adm-row{grid-template-columns:1fr}.adm{padding-top:68px}}
  </style>
  <script>
    (function(){try{const u=JSON.parse(localStorage.getItem('lu62b_student')||sessionStorage.getItem('lu62b_student')||'null');if(!u||String(u.id)!=='0182320012101068')location.replace('login.html');}catch(e){location.replace('login.html')}})();
  </script>
</head>
<body>
  <main class="adm">
    <div class="adm-head"><a class="adm-back" href="profile.html"><i class="fa-solid fa-arrow-left"></i></a><div><h1 style="margin:0;font-size:1.4rem">Admin Control Center</h1><small style="color:var(--muted)">System health · announcements · sync</small></div></div>
    <section id="loginBox" class="adm-login">
      <h2 style="margin-top:0">Admin verification</h2>
      <p style="color:var(--muted);font-size:.85rem">Enter your portal password. The password is verified securely and is not stored.</p>
      <input id="adminPassword" type="password" placeholder="Portal password" autocomplete="current-password">
      <button class="adm-btn adm-primary" style="width:100%;margin-top:12px" onclick="adminLogin()">Verify</button>
      <div class="adm-msg" id="loginMsg"></div>
    </section>
    <section id="dashboard" style="display:none">
      <div class="adm-grid" id="stats"></div>
      <div class="adm-panel">
        <div class="adm-row">
          <button class="adm-btn" onclick="openMainSheet()"><i class="fa-solid fa-table"></i> Open Main Sheet</button>
          <button class="adm-btn" onclick="runMonitor()"><i class="fa-solid fa-rotate"></i> Run Update Sync</button>
        </div>
      </div>
      <div class="adm-panel">
        <h3 style="margin-top:0">Send announcement</h3>
        <select id="annCategory"><option value="general">General</option><option value="notice">Notice</option><option value="classwork">Classwork</option><option value="routine">Routine / Exam</option><option value="app_update">App Update</option></select>
        <input id="annTitle" placeholder="Title">
        <textarea id="annBody" placeholder="Message"></textarea>
        <input id="annLink" value="/" placeholder="Open link">
        <button class="adm-btn adm-primary" style="margin-top:10px" onclick="sendAnnouncement()"><i class="fa-solid fa-paper-plane"></i> Send to students</button>
        <div class="adm-msg" id="annMsg"></div>
      </div>
      <div class="adm-panel"><h3 style="margin-top:0">Recent public notifications</h3><div class="adm-list" id="notificationList"></div></div>
    </section>
  </main>
  <script>
    const WORKER='https://lucse62b-api.sy164425.workers.dev';let adminToken='',statusData={};
    const user=JSON.parse(localStorage.getItem('lu62b_student')||sessionStorage.getItem('lu62b_student'));
    async function req(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(adminToken)h.Authorization='Bearer '+adminToken;const r=await fetch(WORKER+path,{...opt,headers:h});if(!r.ok)throw new Error(r.status===401?'Admin session expired':'Request failed');return r.json()}
    async function adminLogin(){const p=document.getElementById('adminPassword').value,msg=document.getElementById('loginMsg');msg.textContent='Verifying…';try{const d=await req('/admin/login',{method:'POST',body:JSON.stringify({student_id:user.id,password:p})});adminToken=d.token;document.getElementById('loginBox').style.display='none';document.getElementById('dashboard').style.display='block';await refresh()}catch(e){msg.textContent='Verification failed.'}}
    async function refresh(){try{const [s,n]=await Promise.all([req('/admin/status'),req('/admin/notifications')]);statusData=s;renderStats(s);renderNotifications(n.items||[])}catch(e){alert(e.message)}}
    function renderStats(s){const latest=s.latest_app?.version_name||'—',healthy=s.heartbeat?'Healthy':'Unknown';document.getElementById('stats').innerHTML=[['Students',s.students],['Notifications',s.notifications],['Web Push',s.web_push_subscriptions],['FCM Devices',s.fcm_tokens],['Latest APK',latest],['Monitor',healthy]].map(x=>`<div class="adm-card"><small>${x[0]}</small><b>${x[1]??0}</b></div>`).join('')}
    function renderNotifications(items){document.getElementById('notificationList').innerHTML=items.length?items.map(n=>`<div class="adm-note"><div><strong>${esc(n.title)}</strong><br><small>${new Date(n.created_at).toLocaleString()} · ${esc(n.body)}</small></div><button class="adm-btn" onclick="removeNotification('${n.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join(''):'<small>No notifications.</small>'}
    async function sendAnnouncement(){const msg=document.getElementById('annMsg');msg.textContent='Sending…';try{await req('/admin/announcement',{method:'POST',body:JSON.stringify({category:document.getElementById('annCategory').value,title:document.getElementById('annTitle').value,body:document.getElementById('annBody').value,link:document.getElementById('annLink').value||'/'})});msg.textContent='Announcement sent.';document.getElementById('annTitle').value='';document.getElementById('annBody').value='';await refresh()}catch(e){msg.textContent=e.message}}
    async function removeNotification(id){if(!confirm('Delete this notification?'))return;await req('/admin/notifications/'+id,{method:'DELETE'});await refresh()}
    async function runMonitor(){await req('/admin/run-monitor',{method:'POST',body:'{}'});alert('Update monitor started.')}
    function openMainSheet(){if(statusData.main_sheet_url)open(statusData.main_sheet_url,'_blank','noopener')}
    function esc(v){const d=document.createElement('div');d.textContent=String(v||'');return d.innerHTML}
  </script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
